name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder --win --config electron-builder.config.cjs --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm the installer and update manifest reached the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          assets=$(gh release view "v$version" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          for asset in "Armada-Setup-$version.exe" latest.yml; do
            grep -qx "$asset" <<< "$assets" || { echo "::error::Release v$version is missing $asset"; exit 1; }
          done

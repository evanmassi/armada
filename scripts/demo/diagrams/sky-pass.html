<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #080a0f; --fg: #d7dbe2; --muted: #7f8794; --accent: #8fd3e8; --amber: #f0b35b; --green: #6fbf73; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: 'Segoe UI', sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 14px; padding: 14px; }
  canvas { width: 100%; height: 100%; min-height: 0; }
  .panel { display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
  h1 { margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .sub { color: var(--muted); margin-top: -6px; }
  .readout { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 10px; border: 1px solid rgba(143, 211, 232, .25); background: rgba(143, 211, 232, .05); }
  .readout b { color: var(--muted); font-weight: 600; }
  .readout span { text-align: right; font-variant-numeric: tabular-nums; }
  .big { font-size: 20px; color: var(--amber); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 5px 10px; font: inherit; letter-spacing: .1em; cursor: pointer; }
  .note { color: var(--muted); line-height: 1.4; }
  @media (max-width: 520px) {
    body { grid-template-columns: 1fr; grid-template-rows: minmax(160px, 1fr) auto; }
    .note { display: none; }
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="panel">
    <h1>ISS pass</h1>
    <div class="sub">Tonight, 21:42 to 21:48</div>
    <div class="readout">
      <b>Time</b><span id="time">21:42:00</span>
      <b>Elevation</b><span id="elevation" class="big">0°</span>
      <b>Azimuth</b><span id="azimuth">0°</span>
      <b>Direction</b><span id="direction">NW</span>
    </div>
    <input id="scrub" type="range" min="0" max="360" value="0">
    <button id="play">PLAY</button>
    <div class="note">Peak 71° at 21:45. Reminder fires at 21:32, since the peak is above 30°.</div>
  </div>
<script>
  const canvas = document.getElementById('sky');
  const context = canvas.getContext('2d');
  const scrub = document.getElementById('scrub');
  const playButton = document.getElementById('play');
  const START_SECONDS = 21 * 3600 + 42 * 60;
  const DURATION = 360;
  const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  let isPlaying = false;

  const PEAK_ELEVATION = 71;
  const PEAK_AZIMUTH = 30;
  const passAt = (seconds) => {
    const progress = seconds / DURATION;
    const swing = progress * 2 - 1;
    const across = swing * 80;
    const offset = 90 - PEAK_ELEVATION + 22 * swing * swing;
    const distance = Math.min(90, Math.hypot(across, offset));
    const bearing = (Math.atan2(across, offset) * 180) / Math.PI;
    return { azimuth: (PEAK_AZIMUTH + bearing + 360) % 360, elevation: 90 - distance };
  };

  const toPoint = ({ azimuth, elevation }, center, radius) => {
    const distance = radius * (1 - elevation / 90);
    const angle = ((azimuth - 90) * Math.PI) / 180;
    return [center.x + distance * Math.cos(angle), center.y + distance * Math.sin(angle)];
  };

  const draw = () => {
    const ratio = window.devicePixelRatio || 1;
    const { width, height } = canvas.getBoundingClientRect();
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.clearRect(0, 0, width, height);
    const center = { x: width / 2, y: height / 2 };
    const radius = Math.min(width, height) / 2 - 22;

    context.strokeStyle = 'rgba(143, 211, 232, .18)';
    context.lineWidth = 1;
    for (const elevation of [0, 30, 60]) {
      context.beginPath();
      context.arc(center.x, center.y, radius * (1 - elevation / 90), 0, Math.PI * 2);
      context.stroke();
    }
    for (let index = 0; index < 8; index++) {
      const [x, y] = toPoint({ azimuth: index * 45, elevation: 0 }, center, radius);
      context.beginPath();
      context.moveTo(center.x, center.y);
      context.lineTo(x, y);
      context.stroke();
      const [labelX, labelY] = toPoint({ azimuth: index * 45, elevation: -9 }, center, radius);
      context.fillStyle = index === 0 ? '#8fd3e8' : '#7f8794';
      context.font = '600 11px Segoe UI';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(COMPASS[index], labelX, labelY);
    }
    context.fillStyle = '#7f8794';
    context.font = '10px Segoe UI';
    context.fillText('30°', center.x + 4, center.y - radius * (2 / 3) + 10);
    context.fillText('60°', center.x + 4, center.y - radius * (1 / 3) + 10);

    context.strokeStyle = 'rgba(143, 211, 232, .25)';
    context.fillStyle = 'rgba(143, 211, 232, .06)';
    context.beginPath();
    context.arc(center.x, center.y, radius * (2 / 3), 0, Math.PI * 2);
    context.fill();

    const seconds = Number(scrub.value);
    context.lineWidth = 3;
    context.lineCap = 'round';
    context.strokeStyle = 'rgba(143, 211, 232, .35)';
    context.beginPath();
    for (let step = 0; step <= DURATION; step += 4) {
      const [x, y] = toPoint(passAt(step), center, radius);
      step === 0 ? context.moveTo(x, y) : context.lineTo(x, y);
    }
    context.stroke();
    context.strokeStyle = '#8fd3e8';
    context.shadowColor = '#8fd3e8';
    context.shadowBlur = 8;
    context.beginPath();
    for (let step = 0; step <= seconds; step += 2) {
      const [x, y] = toPoint(passAt(step), center, radius);
      step === 0 ? context.moveTo(x, y) : context.lineTo(x, y);
    }
    context.stroke();

    const now = passAt(seconds);
    const [x, y] = toPoint(now, center, radius);
    context.shadowColor = '#f0b35b';
    context.shadowBlur = 16;
    context.fillStyle = '#f0b35b';
    context.beginPath();
    context.arc(x, y, 6, 0, Math.PI * 2);
    context.fill();
    context.shadowBlur = 0;

    const clock = START_SECONDS + seconds;
    const pad = (value) => String(Math.floor(value)).padStart(2, '0');
    document.getElementById('time').textContent = `${pad(clock / 3600)}:${pad((clock % 3600) / 60)}:${pad(clock % 60)}`;
    document.getElementById('elevation').textContent = `${Math.round(now.elevation)}°`;
    const azimuth = now.azimuth % 360;
    document.getElementById('azimuth').textContent = `${Math.round(azimuth)}°`;
    document.getElementById('direction').textContent = COMPASS[Math.round(azimuth / 45) % 8];
  };

  const tick = () => {
    if (!isPlaying) return;
    scrub.value = (Number(scrub.value) + 1) % (DURATION + 1);
    draw();
    requestAnimationFrame(tick);
  };

  scrub.addEventListener('input', draw);
  playButton.addEventListener('click', () => {
    isPlaying = !isPlaying;
    playButton.textContent = isPlaying ? 'PAUSE' : 'PLAY';
    tick();
  });
  window.addEventListener('resize', draw);
  scrub.value = 150;
  draw();
</script>
</body>
</html>

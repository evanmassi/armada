<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Segoe UI, sans-serif">
  <rect width="760" height="520" fill="#080a0f"/>

  <text x="40" y="44" fill="#d7dbe2" font-size="15" font-weight="600" letter-spacing="1.5">USE SOON SCREEN</text>
  <text x="40" y="66" fill="#7f8794" font-size="12">Home tab, sorted by what expires first</text>

  <g transform="translate(40 88)">
    <rect width="250" height="410" rx="30" fill="#10141b" stroke="#2a3340" stroke-width="2"/>
    <rect x="95" y="10" width="60" height="6" rx="3" fill="#2a3340"/>
    <text x="22" y="52" fill="#d7dbe2" font-size="18" font-weight="700">Use soon</text>
    <text x="22" y="72" fill="#7f8794" font-size="11">4 items expire this week</text>

    <g transform="translate(16 88)">
      <rect width="218" height="50" rx="10" fill="#171d27"/>
      <rect x="0" y="0" width="4" height="50" rx="2" fill="#d97a7a"/>
      <text x="16" y="22" fill="#d7dbe2" font-size="13" font-weight="600">Spinach</text>
      <text x="16" y="38" fill="#7f8794" font-size="11">Fridge · 200 g</text>
      <rect x="150" y="15" width="56" height="20" rx="10" fill="rgba(217,122,122,.18)"/>
      <text x="178" y="29" fill="#d97a7a" font-size="10.5" font-weight="700" text-anchor="middle">TODAY</text>
    </g>
    <g transform="translate(16 146)">
      <rect width="218" height="50" rx="10" fill="#171d27"/>
      <rect x="0" y="0" width="4" height="50" rx="2" fill="#f0b35b"/>
      <text x="16" y="22" fill="#d7dbe2" font-size="13" font-weight="600">Eggs</text>
      <text x="16" y="38" fill="#7f8794" font-size="11">Fridge · 4 left</text>
      <rect x="150" y="15" width="56" height="20" rx="10" fill="rgba(240,179,91,.18)"/>
      <text x="178" y="29" fill="#f0b35b" font-size="10.5" font-weight="700" text-anchor="middle">2 DAYS</text>
    </g>
    <g transform="translate(16 204)">
      <rect width="218" height="50" rx="10" fill="#171d27"/>
      <rect x="0" y="0" width="4" height="50" rx="2" fill="#f0b35b"/>
      <text x="16" y="22" fill="#d7dbe2" font-size="13" font-weight="600">Cream</text>
      <text x="16" y="38" fill="#7f8794" font-size="11">Fridge · half carton</text>
      <rect x="150" y="15" width="56" height="20" rx="10" fill="rgba(240,179,91,.18)"/>
      <text x="178" y="29" fill="#f0b35b" font-size="10.5" font-weight="700" text-anchor="middle">3 DAYS</text>
    </g>

    <text x="22" y="290" fill="#7f8794" font-size="11" letter-spacing="1">MAKE TONIGHT</text>
    <g transform="translate(16 302)">
      <rect width="218" height="62" rx="12" fill="rgba(143,211,232,.10)" stroke="#8fd3e8" stroke-width="1.5"/>
      <text x="16" y="26" fill="#d7dbe2" font-size="14" font-weight="700">Spinach frittata</text>
      <text x="16" y="45" fill="#8fd3e8" font-size="11">Uses spinach, eggs, cream</text>
      <text x="196" y="38" fill="#8fd3e8" font-size="18" text-anchor="middle">›</text>
    </g>

    <g transform="translate(0 378)" fill="#7f8794" font-size="10" text-anchor="middle">
      <text x="50" y="14" fill="#8fd3e8" font-weight="700">Home</text>
      <text x="125" y="14">Pantry</text>
      <text x="200" y="14">Recipes</text>
    </g>
  </g>

  <g font-size="12" fill="#d7dbe2">
    <path d="M300 205 H 360" stroke="#d97a7a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="300" cy="205" r="3" fill="#d97a7a"/>
    <text x="370" y="200" font-weight="600">Expiry chip</text>
    <text x="370" y="218" fill="#7f8794">Red today, amber within 3 days. Color and</text>
    <text x="370" y="234" fill="#7f8794">left edge match, so the list scans in a glance.</text>

    <path d="M300 335 H 360" stroke="#8fd3e8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="300" cy="335" r="3" fill="#8fd3e8"/>
    <text x="370" y="330" font-weight="600">One suggestion, not a feed</text>
    <text x="370" y="348" fill="#7f8794">The top recipe from rankRecipes, using the most</text>
    <text x="370" y="364" fill="#7f8794">items that expire first. Tap for the full list.</text>

    <path d="M300 125 H 360" stroke="#7f8794" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="300" cy="125" r="3" fill="#7f8794"/>
    <text x="370" y="120" font-weight="600">Count up front</text>
    <text x="370" y="138" fill="#7f8794">How many items need using this week.</text>

    <path d="M300 476 H 360" stroke="#7f8794" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="300" cy="476" r="3" fill="#7f8794"/>
    <text x="370" y="471" font-weight="600">Three tabs</text>
    <text x="370" y="489" fill="#7f8794">Home opens here; Pantry and Recipes hold the rest.</text>
  </g>
</svg>
